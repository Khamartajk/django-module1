<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>

    <h2>User Login</h2>

    <form method="POST">

        {% csrf_token %}

        <label>Email:</label>
        <input type="email" name="email" required>

        <br><br>

        <label>Password:</label>
        <input type="password" name="password" required>

        <br><br>

        <button type="submit">Login</button>

    </form>

    <div>
      <!-- Display Messages -->
        {% if messages %}
            {% for message in messages %}
                <p style="color:red;">
                    {{ message }}
                </p>
            {% endfor %}
        {% endif %}
    </div>

</body>
</html>
