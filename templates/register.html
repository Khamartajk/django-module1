<!doctype html>
<html>
  <head>
    <title>Register</title>
    <style>
      body {
        font-family: Arial;
        background: #f4f6f9;
      }

      .navbar {
        background: #333;
        padding: 15px;
        color: white;
      }

      .navbar a {
        color: white;
        margin-right: 15px;
        text-decoration: none;
      }

      .card {
        width: 400px;
        margin: 50px auto;
        padding: 25px;
        background: white;
        border-radius: 10px;
        box-shadow: 0px 0px 10px #ccc;
      }

      input {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
      }

      button {
        width: 100%;
        padding: 10px;
        background: #007bff;
        color: white;
        border: none;
      }

      .messages {
        color: red;
        margin-bottom: 10px;
      }
    </style>
  </head>

  <body>
    <div class="navbar">
       <a href="/">Home</a>
       <a href="{% url 'register' %}">Register</a>
       
       {% if user.is_authenticated %}
         <span> <b>Welcome, {{ user.username }} </b> </span>
         <span style="float:right;">
            <a href="{% url 'logout' %}">Logout</a>
         </span>
       {% else %}
          <span style="float:right;">
           <a href="{% url 'login' %}" style="color: white; text-decoration: none;">Login</a>
        </span>
       {% endif %}


    </div>

    <div class="card">
      <h2>Signup</h2>

      <!-- Django Messages -->
      {% if messages %}
      <div class="messages">
        {% for message in messages %}
        <p>{{ message }}</p>
        {% endfor %}
      </div>
      {% endif %}

      <form method="POST">
        {% csrf_token %}

        <input type="text" name="fname" placeholder="First Name" required />
        <input type="text" name="lname" placeholder="Last Name" required />

        <input type="text" name="username" placeholder="Username" required />
        <input type="email" name="email" placeholder="Email" required />
        <input
          type="password"
          name="password1"
          placeholder="Password"
          required
        />
        <input
          type="password"
          name="password2"
          placeholder="Confirm Password"
          required
        />

        <button type="submit">Register</button>
      </form>
    </div>
  </body>
</html>
